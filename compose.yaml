name: hicas-cxm-mcp

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: hicas-cxm-mcp:latest
    container_name: hicas-cxm-mcp
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "9000"
      MCP_INSTANCE_NAME: "hicas-cxm-uat"
      CXM_BASE_URL: "https://cxm.erp-uat.hicas.vn"
      CXM_TOOLS_CONFIG: "config/tools.json"
      CXM_WRITE_TOOLS_CONFIG: "config/write-tools.json"
      BIM_BASE_URL: "https://bim.erp-uat.hicas.vn"
      BIM_TOOLS_CONFIG: "config/bim/tools.json"
      CXM_REFRESH_TOKEN_FILE: "/app/data/cxm-refresh-token"
      MCP_KEY: "${MCP_KEY:?Set MCP_KEY in .env}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?Set MCP_ALLOWED_HOSTS in .env to localhost, the server IP, and any public hostname}"
    ports:
      # Publish on every host interface so LAN clients and a host-level reverse
      # proxy/tunnel can both reach the MCP service. MCP_ALLOWED_HOSTS still
      # restricts which Host headers the application accepts.
      - "9000:9000"
    volumes:
      - cxm-auth-data:/app/data

  mcp-sit:
    build:
      context: .
      dockerfile: Dockerfile
    image: hicas-cxm-mcp:latest
    container_name: hicas-cxm-mcp-sit
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "9000"
      MCP_INSTANCE_NAME: "hicas-cxm-sit"
      CXM_BASE_URL: "https://api.hawee.hicas.vn"
      CXM_TOOLS_CONFIG: "config/sit/tools.json"
      CXM_WRITE_TOOLS_CONFIG: "config/sit/write-tools.json"
      # Never inherit a UAT token from the shared .env. SIT authentication is
      # established through its own login page and persisted in its own volume.
      CXM_ACCESS_TOKEN: ""
      CXM_ACCESS_TOKEN_FILE: ""
      CXM_REFRESH_TOKEN: ""
      CXM_REFRESH_TOKEN_FILE: "/app/data/cxm-refresh-token"
      MCP_KEY: "${MCP_KEY:?Set MCP_KEY in .env}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?Set MCP_ALLOWED_HOSTS in .env to both UAT and SIT hostnames}"
    ports:
      - "9001:9000"
    volumes:
      - cxm-auth-data-sit:/app/data

  mcp-tingop:
    build:
      context: .
      dockerfile: Dockerfile
    image: hicas-cxm-mcp:latest
    container_name: hicas-cxm-mcp-tingop
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "9000"
      MCP_INSTANCE_NAME: "tingop"
      MCP_UPSTREAM_NAME: "TingOp"
      CXM_BASE_URL: "https://tingop.tingconnect.com"
      CXM_TOOLS_CONFIG: "config/tingop/tools.json"
      CXM_WRITE_TOOLS_CONFIG: "config/tingop/write-tools.json"
      TINGOP_CHECKIN_BASE_URL: "https://sit.checkin.tingconnect.com"
      TINGOP_CHECKIN_TOOLS_CONFIG: "config/tingop-checkin/tools.json"
      TINGOP_CHECKIN_WRITE_TOOLS_CONFIG: "config/tingop-checkin/write-tools.json"
      # TingOp has its own OAuth client and must never reuse a CXM token.
      CXM_ACCESS_TOKEN: ""
      CXM_ACCESS_TOKEN_FILE: ""
      CXM_REFRESH_TOKEN: ""
      CXM_REFRESH_TOKEN_FILE: "/app/data/tingop-refresh-token"
      CXM_OAUTH_CLIENT_ID: "TingOp"
      CXM_OAUTH_SCOPE: "offline_access API"
      # This public client value is also present in the TingOp frontend. It can
      # be overridden in .env if TingOp changes its OAuth client configuration.
      CXM_OAUTH_CLIENT_SECRET: "${TINGOP_OAUTH_CLIENT_SECRET:-ConstruxivViewersecret}"
      MCP_KEY: "${MCP_KEY:?Set MCP_KEY in .env}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?Set MCP_ALLOWED_HOSTS in .env},mcp-tingop.lm.io.vn"
    ports:
      - "9002:9000"
    volumes:
      - tingop-auth-data:/app/data

volumes:
  cxm-auth-data:
  cxm-auth-data-sit:
  tingop-auth-data:
